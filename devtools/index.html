<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>YT Dual 하네스</title>
<link rel="stylesheet" href="/overlay.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header>
  <h1>YT Dual 자막 파이프라인</h1>
  <div class="badges">
    <span id="src" class="badge wait">content.js 확인 중</span>
    <span id="worker" class="badge wait">워커 확인 중</span>
  </div>
</header>

<main>

<!-- 1 · 자막 ─────────────────────────────────────────────── -->
<section class="card">
  <h2>1 · 자막</h2>
  <div class="row">
    <select id="fixture"></select>
    <label class="chk"><input type="checkbox" id="normalize" checked> 시간 정규화</label>
  </div>
  <div class="sub" id="fixture-title">—</div>
  <div class="stats" id="stats-source"></div>
</section>

<!-- 2 · 번역 ─────────────────────────────────────────────── -->
<section class="card">
  <h2>2 · 번역</h2>
  <p class="hint">
    재생 위치를 옮기고 <b>여기서 시작</b>을 누르면, 확장과 똑같이 8개를 동시에
    돌려 그 지점부터 번역합니다. 타이머는 <b>그 지점 자막이 화면에 뜨기까지</b>를 잽니다.
  </p>

  <div class="row">
    <span class="lbl">재생 위치</span>
    <input type="range" id="play" min="0" max="100" step="0.1" value="0">
    <output id="play-out">0:00</output>
  </div>

  <div class="row btns">
    <button id="run" class="primary">여기서 시작</button>
    <button id="seek" disabled>여기로 시킹</button>
    <button id="stop" disabled>중지</button>
    <label class="chk"><input type="checkbox" id="bust" checked> 캐시 우회</label>
  </div>

  <div class="gauge" id="gauge">
    <div class="gauge-num"><span id="timer">—</span><small>초</small></div>
    <div class="gauge-bar"><i id="bar"></i><u>3초</u></div>
    <div class="gauge-note" id="gauge-note">대기 중</div>
  </div>

  <div class="stats" id="stats-run"></div>
  <div class="progress"><i id="prog"></i></div>
  <div class="sub" id="prog-note">—</div>
</section>

<!-- 3 · 화면 ─────────────────────────────────────────────── -->
<section class="card">
  <h2>3 · 화면에 뜨는 자막</h2>
  <p class="hint">실제 <code>overlay.css</code> 와 실제 <code>findLine()</code> 으로 그립니다.</p>
  <div class="stage">
    <div id="ytdual-box"><div id="ytdual-orig"></div><div id="ytdual-trans"></div></div>
  </div>
  <div class="row">
    <span class="lbl">미리보기</span>
    <input type="range" id="preview" min="0" max="100" step="0.05" value="0">
    <output id="preview-out">0:00</output>
    <button id="follow" class="small on">재생 위치 따라가기</button>
  </div>
  <div class="stats" id="stats-preview"></div>
</section>

<!-- 4 · 줄 ───────────────────────────────────────────────── -->
<section class="card">
  <h2>4 · 번역된 줄</h2>
  <div class="stats" id="stats-lines"></div>
  <div class="lines" id="lines"></div>
</section>

</main>

<!-- content.js 는 확장 환경을 기대한다. 최소 스텁을 먼저 깔고 원본을 그대로
     실행한다. 사본을 만들면 여기서 본 동작과 출하물이 갈라진다. -->
<script>
window.browser = {
  storage: {
    local: { get: async () => ({ endpoint: location.origin, target: "Korean", autoStart: false }), set: async () => {} },
    onChanged: { addListener: () => {} },
  },
  runtime: { sendMessage: async () => ({}), onMessage: { addListener: () => {} } },
};
</script>
<script src="/content.js"></script>
<script src="/app.js"></script>
</body>
</html>
