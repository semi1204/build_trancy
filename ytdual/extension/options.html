<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT Dual 설정</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; max-width: 460px;
         margin: 32px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 19px; margin-bottom: 4px; }
  p.sub { color: #666; font-size: 13px; margin-top: 0; }
  label { display: block; margin-top: 18px; font-weight: 600; font-size: 13px; }
  input, select { width: 100%; padding: 9px 10px; margin-top: 5px;
                  border: 1px solid #ccc; border-radius: 7px;
                  font-size: 14px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 9px; margin-top: 16px; }
  .row input { width: auto; margin: 0; }
  .row label { margin: 0; font-weight: 400; }
  button { margin-top: 24px; padding: 10px 20px; border: none; border-radius: 7px;
           background: #1a1a1a; color: #fff; font-size: 14px;
           font-weight: 600; cursor: pointer; }
  #saved { color: #0a7d32; font-size: 13px; margin-left: 10px; opacity: 0;
           transition: opacity .2s; }
  #saved.on { opacity: 1; }
  kbd { background: #eee; border-radius: 4px; padding: 1px 6px;
        font-size: 12px; font-family: ui-monospace, monospace; }
  .keys { margin-top: 28px; font-size: 13px; color: #555;
          border-top: 1px solid #eee; padding-top: 16px; }
</style>
</head>
<body>
  <h1>YT Dual 설정</h1>
  <p class="sub">자막은 브라우저가 직접 가져오고, 번역만 Worker가 처리합니다.</p>

  <label>Worker 주소
    <input id="endpoint" type="url" placeholder="https://sub.내도메인.com">
  </label>

  <label>번역 언어
    <input id="target" type="text" placeholder="Korean">
  </label>

  <label>원본 자막 선호 언어
    <select id="prefer">
      <option value="en">영어</option>
      <option value="ja">일본어</option>
      <option value="zh">중국어</option>
      <option value="es">스페인어</option>
      <option value="">자동</option>
    </select>
  </label>

  <label>자막 크기 (px)
    <input id="fontSize" type="number" min="12" max="48" step="1">
  </label>

  <div class="row" style="margin-top:18px">
    <input id="origColor" type="color" style="width:44px;height:32px;padding:2px">
    <label for="origColor">원문 자막 색</label>
    <input id="transColor" type="color" style="width:44px;height:32px;padding:2px;margin-left:14px">
    <label for="transColor">번역 자막 색</label>
  </div>

  <div class="row">
    <input id="autoStart" type="checkbox">
    <label for="autoStart">영상 열면 자동 시작</label>
  </div>
  <div class="row">
    <input id="showOriginal" type="checkbox">
    <label for="showOriginal">원문 표시</label>
  </div>
  <div class="row">
    <input id="showTranslation" type="checkbox">
    <label for="showTranslation">번역 표시</label>
  </div>

  <button id="save">저장</button><span id="saved">저장됨</span>

  <p style="margin-top:26px"><a href="anki.html" target="_blank">Anki 내보내기 열기 →</a>
  <br><span style="color:#666;font-size:12px">PC에서 Anki를 켜둔 채로 여세요</span></p>

  <div class="keys">
    <kbd>Alt</kbd>+<kbd>Y</kbd> 영상 자막 켜기·끄기 &nbsp;
    <kbd>Alt</kbd>+<kbd>A</kbd> 번역 토글 (유튜브: 번역 줄 · 일반 페이지: 페이지 번역)<br>
    <kbd>Ctrl</kbd>+<kbd>R</kbd> 현재 문장 반복 &nbsp;
    <kbd>Ctrl</kbd>+<kbd>S</kbd> 현재 문장 저장 &nbsp;
    <kbd>Ctrl</kbd>+<kbd>←</kbd> <kbd>→</kbd> 문장 이동 &nbsp;
    <kbd>Ctrl</kbd>+<kbd>+</kbd> <kbd>−</kbd> 자막 크기<br>
    단어 <b>더블클릭</b>: 어느 페이지서든 문맥 뜻 팝업
  </div>

  <script src="options.js"></script>
</body>
</html>
